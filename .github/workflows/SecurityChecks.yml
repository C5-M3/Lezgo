# Security checks for every pull request and every push to a trunk branch.
# Builds and TestFlight run in Xcode Cloud; this workflow only guards the source.

name: Security Checks

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

# Read-only token: these jobs never write to the repository.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcsset-scan:
    name: XCSSET Malware Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the scanner
        run: Scripts/Tests/ScanForXcssetTests.sh

      - name: Scan the repository
        run: Scripts/ScanForXcsset.sh .

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Downloaded directly and verified by checksum, so a changed release cannot run here.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
