# Checks that every pull request follows the team workflow in AGENTS.md:
# branch name, branch flow (feature -> dev -> staging -> main), PR title and commits.

name: Pull Request Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: Branch, Title and Commit Rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the rule checker
        run: Scripts/Tests/CheckPullRequestRulesTests.sh

      # Branch names and titles are user input, so they are passed through
      # environment variables and never pasted into the script with ${{ }}.
      - name: Check pull request rules
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%s "$BASE_SHA..$HEAD_SHA" | Scripts/CheckPullRequestRules.sh "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_TITLE"
