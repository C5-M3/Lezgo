<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Lezgo trip</title>
  <style>
    :root { color-scheme: light dark; --accent: #0a66d8; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main { max-width: 360px; padding: 24px 16px; text-align: center; }
    .code { font-size: 2.5rem; font-weight: 700; letter-spacing: 0.2em; margin: 16px 0; }
    a.button {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Join my Lezgo trip</h1>
    <div class="code" id="code" aria-label="Room code"></div>
    <a class="button" id="open" href="lezgo://join">Open in Lezgo</a>
    <p>Don't have Lezgo yet? Install it, then open this link again or type the room code in Lezgo.</p>
  </main>
  <script>
    // The page only shows the code; the app validates it again before joining.
    const code = new URLSearchParams(location.search).get("code") || "";
    if (/^[0-9]{6}$/.test(code)) {
      document.getElementById("code").textContent = code;
      document.getElementById("open").href = "lezgo://join?code=" + code;
    }
  </script>
</body>
</html>
