# SwiftLint rules for Lezgo. See AGENTS.md for the naming rules these settings follow.

included:
  - Lezgo
  - LezgoTests
  - LezgoUITests

excluded:
  - DerivedData
  - build
  - .build

disabled_rules:
  # AGENTS.md allows a TODO when it names an issue number; reviewers check the rest.
  - todo

opt_in_rules:
  # Accessibility (AGENTS.md: accessibility minimum bar)
  - accessibility_label_for_image
  - accessibility_trait_for_button
  # Safety
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  # Clean, modern Swift
  - closure_spacing
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

identifier_name:
  # Functions are PascalCase by team decision, so a leading capital letter is allowed.
  # Variables stay camelCase through the custom rule below.
  validates_start_with_lowercase: off
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

custom_rules:
  camel_case_variables:
    name: "camelCase variables"
    regex: '\b(let|var)\s+[A-Z][A-Za-z0-9]*\s*[:=]'
    message: "Variables, constants and properties use camelCase (AGENTS.md naming rules)."
    severity: warning
  no_print:
    name: "No print debugging"
    regex: '(^|[^.\w])print\('
    message: "Remove print debugging before committing. Use Logger for logs that should stay."
    severity: warning
